[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[build]
  publish = "public"
  functions = "netlify/functions"

[[redirects]]
  from = "/about"
  to = "/index.html"
  status = 200

